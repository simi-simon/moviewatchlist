services:
  # -------------------------------------------------------------
  # Backend Web Service (Node.js / Express API)
  # -------------------------------------------------------------
  - type: web
    name: movie-watchlist-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        sync: false

  # -------------------------------------------------------------
  # Frontend Static Site (Vite React)
  # -------------------------------------------------------------
  - type: web
    name: movie-watchlist-ui
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
